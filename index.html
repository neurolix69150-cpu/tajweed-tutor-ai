    <script>
      // Force-clean stale Service Workers + caches on each new deploy.
      // Fixes blank-screen caused by old SW intercepting requests with a broken bundle.
      (function () {
        try {
          // Bump SW_VERSION on every deploy that needs to invalidate stale caches.
          var SW_VERSION = '2026-05-12-a';
          var BUILD_KEY = 'app_build_marker';
          var VERSION_KEY = 'app_sw_version';
          var marker = (document.querySelector('script[type=module][src*="/assets/"]') || {}).src || '';
          var prev = localStorage.getItem(BUILD_KEY);
          var prevVersion = localStorage.getItem(VERSION_KEY);
          var changed = (marker && marker !== prev) || prevVersion !== SW_VERSION;
          if (marker) localStorage.setItem(BUILD_KEY, marker);
          localStorage.setItem(VERSION_KEY, SW_VERSION);

          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              if (!regs.length && !changed) return;
              // If multiple SWs, or build/version changed -> nuke everything and reload once.
              var shouldClean = regs.length > 1 || changed;
              if (!shouldClean) return;
              Promise.all(regs.map(function (r) { return r.unregister(); }))
                .then(function () {
                  if (window.caches && caches.keys) {
                    return caches.keys().then(function (names) {
                      return Promise.all(names.map(function (n) { return caches.delete(n); }));
                    });
                  }
                })
                .then(function () {
                  if (changed) window.location.reload();
                })
                .catch(function () {});
            }).catch(function () {});
          }
        } catch (e) { /* ignore */ }
      })();
    </script>
